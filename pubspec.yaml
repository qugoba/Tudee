name: tudee
description: "Tudee, a simple to-do app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  firebase_core: ^4.15.0
  cloud_firestore: 6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.3.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  fonts:
    - family: CerryBomb
      fonts:
        - asset: fonts/CherryBombOne-Regular.ttf
